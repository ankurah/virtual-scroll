[package]
name = "ankurah-virtual-scroll"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
description = "Platform-agnostic virtual scroll state machine with pagination for Ankurah"

[features]
default = []
# Platform features (empty - derive macro generates platform-specific code)
uniffi = []
wasm = []

[dependencies]
# Ankurah for LiveQuery and signals
ankurah = { git = "https://github.com/ankurah/ankurah", rev = "f8e85d2e2399c0c5bdf80ef06498b5f454b87ac0", features = ["derive"] }
ankql = { git = "https://github.com/ankurah/ankurah", rev = "f8e85d2e2399c0c5bdf80ef06498b5f454b87ac0" }
ankurah-proto = { git = "https://github.com/ankurah/ankurah", rev = "f8e85d2e2399c0c5bdf80ef06498b5f454b87ac0" }
ankurah-signals = { git = "https://github.com/ankurah/ankurah", rev = "f8e85d2e2399c0c5bdf80ef06498b5f454b87ac0" }
tracing = "0.1"

# Re-export derive macro for convenience
ankurah-virtual-scroll-derive = { path = "../virtual-scroll-derive", version = "=0.9.0" }

[dev-dependencies]
ankurah-storage-sled = { git = "https://github.com/ankurah/ankurah", rev = "f8e85d2e2399c0c5bdf80ef06498b5f454b87ac0" }
wasm-bindgen = "0.2"  # Workaround for https://github.com/ankurah/ankurah/issues/211
tokio = { version = "1", features = ["rt", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
ctor = "0.2"
tracing-subscriber = "0.3"
